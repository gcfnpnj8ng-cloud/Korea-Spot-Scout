let person=localStorage.getItem("kss-person")||"Partner",view="swipe";
const votes=JSON.parse(localStorage.getItem("kss-votes")||'{"Mikkel":{},"Partner":{}}');
function save(){localStorage.setItem("kss-votes",JSON.stringify(votes));localStorage.setItem("kss-person",person)}
function toast(t){const x=document.getElementById("toast");x.textContent=t;x.classList.add("show");setTimeout(()=>x.classList.remove("show"),1500)}
function filtered(){let c=document.getElementById("city").value,k=document.getElementById("category").value;return spots.filter(s=>(!c||s.city===c)&&(!k||s.category===k))}
function remaining(){return filtered().filter(s=>!votes[person][s.id])}
function isMatch(id){return votes.Mikkel[id]==="LIKE"&&votes.Partner[id]==="LIKE"}
function render(){
 document.querySelectorAll(".profile button").forEach(b=>b.classList.toggle("active",b.dataset.person===person));
 document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("active",b.dataset.view===view));
 const el=document.getElementById("content");
 if(view==="swipe"){const s=remaining()[0];if(!s){el.innerHTML='<div class="empty">🎉 Du er færdig med denne bunke.<br><br>Skift filter eller se jeres matches.</div>';return}
 el.innerHTML=`<div class="card" id="card"><div class="hero"><img src="${s.img}" onerror="this.style.display='none'"><div class="grad"></div><div class="overlay"><div class="name">${s.name}</div><div class="ko">${s.ko}</div><div class="meta">${s.city} · ${s.area}</div><div class="badges"><span class="badge">${s.type}</span><span class="badge">${s.category}</span><span class="badge">${s.price}</span><span class="badge">${s.time}</span></div></div></div><div class="body"><div class="why">${s.desc}<br><br><b>Hvorfor gemme:</b> ${s.why}</div><div class="ref">Referencebillede · rettigheder ikke afklaret til endelig app-brug</div><div class="actions"><button class="no" onclick="vote('${s.id}','NO')">✕ Nej</button><button class="maybe" onclick="vote('${s.id}','MAYBE')">? Måske</button><button class="yes" onclick="vote('${s.id}','LIKE')">♥ Like</button></div><button class="detailsBtn" onclick="details('${s.id}')">Se alle detaljer</button></div></div>`;
 swipeSetup(s.id);return}
 let list=filtered();
 if(view==="matches") list=list.filter(s=>isMatch(s.id));
 if(view==="likes") list=list.filter(s=>votes[person][s.id]==="LIKE");
 el.innerHTML=list.length?'<div class="grid">'+list.map(s=>mini(s)).join("")+'</div>':'<div class="empty">Ingen spots i denne visning endnu.</div>';
}
function mini(s){return `<div class="mini" onclick="details('${s.id}')"><img src="${s.img}" onerror="this.style.display='none'"><div><h3>${s.name}</h3><p>${s.ko}</p><p>${s.city} · ${s.area}</p><span class="pill">${s.category}</span><span class="pill">${s.type}</span>${isMatch(s.id)?'<p class="match">♥ MATCH</p>':''}</div></div>`}
function vote(id,v){votes[person][id]=v;save();if(isMatch(id))toast("♥ MATCH!");else toast(v==="LIKE"?"Gemt ♥":v==="MAYBE"?"Måske":"Sprunget over");render()}
function swipeSetup(id){let card=document.getElementById("card"),x0=null;card.addEventListener("touchstart",e=>x0=e.touches[0].clientX,{passive:true});card.addEventListener("touchend",e=>{if(x0===null)return;let d=e.changedTouches[0].clientX-x0;if(d>80)vote(id,"LIKE");if(d<-80)vote(id,"NO");x0=null},{passive:true})}
function details(id){const s=spots.find(x=>x.id===id), d=document.getElementById("detail");let hike=s.hike?`<div class="row"><b>Hike</b>Distance: ${s.hike.distance}<br>Højdemeter: ${s.hike.elevation}<br>Varighed: ${s.hike.duration}<br>Sværhedsgrad: ${s.hike.difficulty}<br>Start: ${s.hike.start}<br>Slut: ${s.hike.end}<br>Rundtur: ${s.hike.loop}<br>Underlag: ${s.hike.surface}<br>Udstyr: ${s.hike.gear}<br>Adgang: ${s.hike.access}</div>`:'';d.innerHTML=`<h2>${s.name}</h2><div class="ko">${s.ko}</div><div class="badges"><span class="badge">${s.type}</span><span class="badge">${s.category}</span><span class="badge">${s.price}</span><span class="badge">${s.time}</span></div><div class="row"><b>Hvorfor interessant</b>${s.why}</div><div class="row"><b>Åbningstider</b>${s.hours}</div><div class="row"><b>Reservation</b>${s.reservation}</div><div class="row"><b>Bedste tidspunkt / sæson</b>${s.best}</div><div class="row"><b>Transport</b>${s.transport}</div><div class="row"><b>Gang / fysisk</b>${s.walking}</div><div class="row"><b>Adresse / start</b>${s.address}</div><div class="row"><b>I nærheden</b>${s.nearby}</div><div class="row"><b>Vejr / sikkerhed</b>${s.safety}</div>${hike}<div class="row"><b>Scout status</b>${s.status} · Confidence: ${s.confidence} · Kontrolleret 20.09.2026</div><div class="links"><a href="${s.naver}" target="_blank">Naver Map</a><a href="${s.maps}" target="_blank">Google Maps</a></div>`;document.getElementById("sheet").classList.add("show")}
document.getElementById("closeSheet").onclick=()=>document.getElementById("sheet").classList.remove("show");
document.getElementById("sheet").addEventListener("click",e=>{if(e.target.id==="sheet")e.currentTarget.classList.remove("show")});
document.querySelectorAll(".profile button").forEach(b=>b.onclick=()=>{person=b.dataset.person;save();render()});
document.querySelectorAll(".nav button").forEach(b=>b.onclick=()=>{view=b.dataset.view;render()});
for(const c of [...new Set(spots.map(s=>s.city))]) city.innerHTML+=`<option>${c}</option>`;
for(const c of [...new Set(spots.map(s=>s.category))]) category.innerHTML+=`<option>${c}</option>`;
city.onchange=category.onchange=render;
document.getElementById("exportBtn").onclick=()=>{const blob=new Blob([JSON.stringify({version:1,votes},null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="korea-spot-scout-valg.json";a.click();URL.revokeObjectURL(a.href)};
document.getElementById("importBtn").onclick=()=>document.getElementById("importFile").click();
document.getElementById("importFile").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(d.votes){votes.Mikkel=d.votes.Mikkel||{};votes.Partner=d.votes.Partner||{};save();toast("Valg importeret");render()}}catch(_){toast("Kunne ikke importere filen")}};r.readAsText(f)};
render();
</script>
</body></html>
