let person=localStorage.getItem("kss-person")||"Louise",view="swipe";
const votes=JSON.parse(localStorage.getItem("kss-votes")||'{"Mikkel":{},"Louise":{}}');
function save(){localStorage.setItem("kss-votes",JSON.stringify(votes));localStorage.setItem("kss-person",person)}
function toast(t){const x=document.getElementById("toast");x.textContent=t;x.classList.add("show");setTimeout(()=>x.classList.remove("show"),1500)}
function filtered(){let c=document.getElementById("city").value,k=document.getElementById("category").value;return spots.filter(s=>(!c||s.city===c)&&(!k||s.category===k))}
function remaining(){return filtered().filter(s=>!votes[person][s.id])}
function isMatch(id){return votes.Mikkel[id]==="LIKE"&&votes.Louise[id]==="LIKE"}
function render(){
 const total=filtered().length,done=total-remaining().length,matches=filtered().filter(s=>isMatch(s.id)).length;
 document.querySelector(".filters").style.display=view==="tiktok"?"none":"";
 document.querySelector(".progress").style.display=view==="tiktok"?"none":"";
 document.getElementById("progressText").textContent=`${done}/${total} swipet`;
 document.getElementById("progressBar").style.width=(total?Math.round(done/total*100):0)+"%";
 document.getElementById("matchCount").textContent=`${matches} match${matches===1?"":"es"}`;
 document.querySelectorAll(".profile button").forEach(b=>b.classList.toggle("active",b.dataset.person===person));
 document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("active",b.dataset.view===view));
 const el=document.getElementById("content");
 if(view==="tiktok"){el.innerHTML='<iframe class="discoveryFrame" src="discovery/?embed=1&data=chunks-v1&v=20260928-1" title="TikTok-fund"></iframe>';return}
 if(view==="research"){
   el.innerHTML=`<div class="researchCard"><h3>Sådan researcher Korea Spot Scout</h3><p>Vi bruger flere lag af kilder i stedet for at stole på én TikTok, blog eller Google-rating. Målet er både at finde <b>det nye</b> og kontrollere <b>det praktiske</b>.</p>
   <div class="sourceTier"><div class="tierBadge">A</div><div><b>Officielle & primære kilder</b><p>KTO/VISITKOREA, Visit Seoul, Visit Busan, kommuner, nationalparker, officielle venues/brands.</p></div></div>
   <div class="sourceTier"><div class="tierBadge">B</div><div><b>Koreanske lokale kilder</b><p>Naver Map, Naver Blog, koreanske eventkalendere, officielle Instagram-profiler og lokale medier.</p></div></div>
   <div class="sourceTier"><div class="tierBadge">C</div><div><b>Trend & community-signaler</b><p>Reddit, YouTube og offentlige sociale opslag bruges til at opdage steder, køer, prisniveau, vibe og ændringer.</p></div></div>
   <div class="sourceTier"><div class="tierBadge">D</div><div><b>Scout-vurdering</b><p>Jeg vurderer derefter relevans for jer, unikhed, friskhed, lokal autenticitet, turistfælde-risiko og hvor nemt stedet passer sammen med andre spots.</p></div></div></div>
   <div class="researchCard"><h3>TikTok-filter · 27.09.2026</h3><p><b>12.338 fund blev behandlet, 5.974 frasorteret og 6.364 TikToks bevaret.</b> De bevarede opslag gav 10.015 lokaliserbare stedkort, fordi ét opslag kan nævne flere steder. Discovery-kortene ligger i en separat swipe-bunke og er ikke markeret som færdigt verificerede spots.</p><div class="sourceLinks"><a href="discovery/">Åbn 10.015 TikTok-stedkort</a><a href="data/tiktok-candidates-2026-09-27.json" target="_blank" rel="noopener">Se seneste kandidatlog</a></div></div>
   <div class="researchCard"><h3>Regel for databasen</h3><p><b>Social omtale finder kandidaten. Officiel/lokal dokumentation verificerer kandidaten.</b> Dubletter, udløbne pop-ups og fund uden tilstrækkelig kontrol bliver i kandidatloggen og får ikke en score som færdigt kort. Pop-ups, åbningstider, hikes og events kontrolleres igen tæt på april 2027.</p></div>`;return;
 }
 if(view==="swipe"){const s=remaining()[0];if(!s){el.innerHTML='<div class="empty">🎉 Du er færdig med denne bunke.<br><br>Skift filter eller se jeres matches.</div>';return}
 el.innerHTML=`<div class="card" id="card"><div class="hero"><img src="${s.img}" onerror="this.style.display='none'"><div class="grad"></div><div class="overlay"><div class="name">${s.name}</div><div class="ko">${s.ko}</div><div class="meta">${s.city} · ${s.area}</div><div class="badges"><span class="badge">${s.type}</span><span class="badge">${s.category}</span><span class="badge">${s.price}</span><span class="badge">${s.time}</span></div></div></div><div class="body"><div class="why">${s.desc}<br><br><b>Hvorfor gemme:</b> ${s.why}</div><div class="ref">Research: ${researchSources[s.id]?.quality||s.confidence} confidence · tjekket ${researchSources[s.id]?.checked||"20.09.2026"}<span class="sourceQuality">${(researchSources[s.id]?.sources||[]).length} kontrolkilder${(researchSources[s.id]?.mentions||[]).length?` · ${(researchSources[s.id]?.mentions||[]).length} mentions`:""}</span><br>Referencebillede · rettigheder ikke afklaret til endelig app-brug</div><div class="actions"><button class="no" onclick="vote('${s.id}','NO')">✕ Nej</button><button class="maybe" onclick="vote('${s.id}','MAYBE')">? Måske</button><button class="yes" onclick="vote('${s.id}','LIKE')">♥ Like</button></div><button class="detailsBtn" onclick="details('${s.id}')">Se alle detaljer</button></div></div>`;
 swipeSetup(s.id);return}
 let list=filtered();
 if(view==="matches") list=list.filter(s=>isMatch(s.id));
 if(view==="likes") list=list.filter(s=>votes[person][s.id]==="LIKE");
 el.innerHTML=list.length?'<div class="grid">'+list.map(s=>mini(s)).join("")+'</div>':'<div class="empty">Ingen spots i denne visning endnu.</div>';
}
function mini(s){return `<div class="mini" onclick="details('${s.id}')"><img src="${s.img}" onerror="this.style.display='none'"><div><h3>${s.name}</h3><p>${s.ko}</p><p>${s.city} · ${s.area}</p><span class="pill">${s.category}</span><span class="pill">${s.type}</span>${isMatch(s.id)?'<p class="match">♥ MATCH</p>':''}</div></div>`}
function vote(id,v){votes[person][id]=v;save();if(isMatch(id))toast("♥ MATCH!");else toast(v==="LIKE"?"Gemt ♥":v==="MAYBE"?"Måske":"Sprunget over");render()}
function swipeSetup(id){let card=document.getElementById("card"),x0=null;card.addEventListener("touchstart",e=>x0=e.touches[0].clientX,{passive:true});card.addEventListener("touchend",e=>{if(x0===null)return;let d=e.changedTouches[0].clientX-x0;if(d>80)vote(id,"LIKE");if(d<-80)vote(id,"NO");x0=null},{passive:true})}
function details(id){const s=spots.find(x=>x.id===id), d=document.getElementById("detail"),r=researchSources[s.id]||{};let hike=s.hike?`<div class="row"><b>Hike</b>Distance: ${s.hike.distance}<br>Højdemeter: ${s.hike.elevation}<br>Varighed: ${s.hike.duration}<br>Sværhedsgrad: ${s.hike.difficulty}<br>Start: ${s.hike.start}<br>Slut: ${s.hike.end}<br>Rundtur: ${s.hike.loop}<br>Underlag: ${s.hike.surface}<br>Udstyr: ${s.hike.gear}<br>Adgang: ${s.hike.access}</div>`:'';d.innerHTML=`<h2>${s.name}</h2><div class="ko">${s.ko}</div><div class="badges"><span class="badge">${s.type}</span><span class="badge">${s.category}</span><span class="badge">${s.price}</span><span class="badge">${s.time}</span></div><div class="row"><b>Hvorfor interessant</b>${s.why}</div><div class="row"><b>Åbningstider</b>${s.hours}</div><div class="row"><b>Reservation</b>${s.reservation}</div><div class="row"><b>Bedste tidspunkt / sæson</b>${s.best}</div><div class="row"><b>Transport</b>${s.transport}</div><div class="row"><b>Gang / fysisk</b>${s.walking}</div><div class="row"><b>Adresse / start</b>${s.address}</div><div class="row"><b>I nærheden</b>${s.nearby}</div><div class="row"><b>Vejr / sikkerhed</b>${s.safety}</div>${hike}<div class="row"><b>Scout status</b>${s.status} · Confidence: ${s.confidence} · Kontrolleret ${r.checked||"20.09.2026"}</div><div class="row"><b>Kontrolkilder</b>${r.note||""}<div class="sourceLinks">${(r.sources||[]).map(x=>`<a href="${x[1]}" target="_blank" rel="noopener">${x[0]}</a>`).join("")}</div></div>${(r.mentions||[]).length?`<div class="row"><b>TikTok & discovery-mentions</b>Brugt til at finde eller prioritere kandidaten — ikke som eneste faktakontrol.<div class="sourceLinks">${r.mentions.map(x=>`<a href="${x[1]}" target="_blank" rel="noopener">${x[0]}</a>`).join("")}</div></div>`:""}<div class="links"><a href="${s.naver}" target="_blank" rel="noopener">Naver Map</a><a href="${s.maps}" target="_blank" rel="noopener">Google Maps</a></div>`;document.getElementById("sheet").classList.add("show")}
document.getElementById("closeSheet").onclick=()=>document.getElementById("sheet").classList.remove("show");
document.getElementById("sheet").addEventListener("click",e=>{if(e.target.id==="sheet")e.currentTarget.classList.remove("show")});
document.querySelectorAll(".profile button").forEach(b=>b.onclick=()=>{person=b.dataset.person;save();render()});
document.querySelectorAll(".nav button").forEach(b=>b.onclick=()=>{view=b.dataset.view;render()});
for(const c of [...new Set(spots.map(s=>s.city))]) city.innerHTML+=`<option>${c}</option>`;
for(const c of [...new Set(spots.map(s=>s.category))]) category.innerHTML+=`<option>${c}</option>`;
city.onchange=category.onchange=render;
document.getElementById("exportBtn").onclick=()=>{const blob=new Blob([JSON.stringify({version:1,votes},null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="korea-spot-scout-valg.json";a.click();URL.revokeObjectURL(a.href)};
document.getElementById("importBtn").onclick=()=>document.getElementById("importFile").click();
document.getElementById("resetBtn").onclick=()=>{if(confirm(`Nulstil alle ${person}s valg?`)){votes[person]={};save();toast("Profil nulstillet");render()}};
document.getElementById("importFile").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(d.votes){votes.Mikkel=d.votes.Mikkel||{};votes.Louise=d.votes.Louise||d.votes.Partner||{};save();toast("Valg importeret");render()}}catch(_){toast("Kunne ikke importere filen")}};r.readAsText(f)};
let installPrompt=null;
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();installPrompt=e;document.getElementById("installBtn").style.display="inline-block"});
document.getElementById("installBtn").onclick=async()=>{if(installPrompt){installPrompt.prompt();await installPrompt.userChoice;installPrompt=null;document.getElementById("installBtn").style.display="none"}else{toast("Brug browsermenuen → Føj til hjemmeskærm")}};
if("serviceWorker" in navigator) window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
render();
